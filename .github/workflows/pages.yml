name: pages
# Deploy the repo root to GitHub Pages through Actions (Jason OK'd Nov 8 2:25 PM): no hourly build cap, so the
# live-runner can publish data every minute. Triggered by pushes to main and by the runner (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-2
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: canonical power and border feeds
        run: |
          python3 - <<'PYDATA'
          import json, pathlib, datetime
          def load(path):
              try: return json.loads(path.read_text())
              except Exception: return {}
          def stamp(data):
              try: return datetime.datetime.fromisoformat(data.get("updated","").replace("Z","+00:00")).timestamp()
              except Exception: return 0
          for legacy, canonical, kind in [("water.json","power-cuts.json","power"),("roads.json","border-queues.json","border")]:
              source=pathlib.Path(legacy); target=pathlib.Path(canonical)
              old=load(source); new=load(target)
              if old.get("kind")==kind and (new.get("kind")!=kind or stamp(old)>stamp(new) or (stamp(old)==stamp(new) and old!=new)):
                  target.write_bytes(source.read_bytes())
          PYDATA
      - name: site files only
        run: rm -rf .git .github scripts
      # regenerate the screen's self-update marker from the bundle this artifact actually serves, so a bundle deploy
      # can never leave version.json naming an older build (Nov 21 2026: a stale marker looped screens into reloading
      # every 2 minutes). Artifact-only: nothing is committed, so no race with live-runner data commits.
      - name: version marker for screen self-update
        run: |
          BUNDLE=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' index.html | head -1 | sed 's|assets/||')
          VER=$(grep -o '"version": *"[^"]*"' version.json 2>/dev/null | head -1 | cut -d'"' -f4)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$BUNDLE" ] && [ -n "$VER" ]; then
            printf '{\n  "build": "%s",\n  "version": "%s",\n  "deployed_at": "%s"\n}\n' "$BUNDLE" "$VER" "$NOW" > version.json
          elif [ -n "$BUNDLE" ]; then
            printf '{\n  "build": "%s",\n  "deployed_at": "%s"\n}\n' "$BUNDLE" "$NOW" > version.json
          fi
          cat version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # deploy-pages intermittently fails to fetch the just-uploaded artifact metadata (transient GitHub-side
      # error). One immediate retry absorbs the flake; the run goes red only if both attempts fail.
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
