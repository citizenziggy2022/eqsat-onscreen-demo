name: pages
# Deploy the repo root to GitHub Pages through Actions (Jason OK'd Nov 8 2:25 PM): no hourly build cap, so the
# live-runner can publish data every minute. Triggered by pushes to main and by the runner (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: site files only
        run: rm -rf .git .github scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
