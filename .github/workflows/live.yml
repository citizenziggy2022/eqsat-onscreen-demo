name: live
# Every 5 min: alerttypes.json (siren.pp.ua alert types) for the eQsat screen. GitHub may delay scheduled runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/alerttypes.py
      - name: commit
        run: |
          git config user.name "eqsat-feeds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerttypes.json
          git diff --cached --quiet || (git commit -m "live: alert types $(date -u +%H:%MZ)" && git pull --rebase && git push)
