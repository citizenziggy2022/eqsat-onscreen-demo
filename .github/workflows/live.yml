name: live
# Every 5 min: alerttypes.json (siren.pp.ua alert types) + news.json (RSS, Telegram, Bluesky) for the eQsat screen. GitHub may delay scheduled runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/alerttypes.py
      - run: pip install requests && python3 scripts/fetch_news.py || echo "news fetch failed, keeping last news.json"
      - name: commit
        run: |
          git config user.name "eqsat-feeds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerttypes.json news.json radiation.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "live: alerts + news $(date -u +%H:%MZ)"
            if git pull --rebase && git push; then
              echo pushed
            else
              git rebase --abort 2>/dev/null || true
              echo "push race with the every-minute live-runner: dropped this cycle's commit. No data lost - the runner rewrites these files every minute and the next scheduled run re-fetches."
            fi
          fi
